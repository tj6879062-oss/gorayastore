<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goraya Store</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
  color:#fff;
  background:#050816;
  overflow-x:hidden;
}

/* Animated background */
.stars{
  position:fixed;
  inset:0;
  overflow:hidden;
  z-index:-2;
  background:
    radial-gradient(circle at 20% 20%,#172554 0,transparent 30%),
    radial-gradient(circle at 80% 80%,#312e81 0,transparent 30%),
    #050816;
}

.star{
  position:absolute;
  width:2px;
  height:2px;
  background:white;
  border-radius:50%;
  animation:moveStar linear infinite;
}

@keyframes moveStar{
  from{
    transform:translateY(0);
    opacity:.2;
  }
  50%{
    opacity:1;
  }
  to{
    transform:translateY(-110vh);
    opacity:.1;
  }
}

.container{
  width:min(1200px,94%);
  margin:auto;
}

.hidden{
  display:none!important;
}

.card{
  background:rgba(15,23,42,.82);
  border:1px solid rgba(255,255,255,.1);
  border-radius:18px;
  padding:20px;
  box-shadow:0 15px 45px rgba(0,0,0,.3);
  backdrop-filter:blur(12px);
}

button,
.btn{
  border:0;
  padding:11px 17px;
  border-radius:10px;
  cursor:pointer;
  color:white;
  background:linear-gradient(135deg,#2563eb,#7c3aed);
  font-weight:bold;
  transition:.2s;
}

button:hover,
.btn:hover{
  transform:translateY(-2px);
  filter:brightness(1.12);
}

.btn-green{
  background:linear-gradient(135deg,#16a34a,#059669);
}

.btn-red{
  background:linear-gradient(135deg,#dc2626,#b91c1c);
}

.btn-gray{
  background:#334155;
}

input,
select,
textarea{
  width:100%;
  padding:12px;
  margin-top:7px;
  margin-bottom:13px;
  border-radius:9px;
  border:1px solid #334155;
  background:#0f172a;
  color:white;
  outline:none;
}

textarea{
  min-height:90px;
  resize:vertical;
}

label{
  font-size:14px;
  color:#cbd5e1;
}

h1,h2,h3{
  margin-bottom:12px;
}

p{
  color:#cbd5e1;
}

/* AUTH */
#authScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px;
}

.auth-box{
  width:min(470px,100%);
}

.logo{
  text-align:center;
  font-size:34px;
  font-weight:900;
  margin-bottom:8px;
}

.logo span{
  color:#60a5fa;
}

.subtitle{
  text-align:center;
  margin-bottom:20px;
}

.tabs{
  display:flex;
  gap:8px;
  margin-bottom:15px;
}

.tabs button{
  flex:1;
}

.role-buttons{
  display:flex;
  gap:10px;
  margin-bottom:15px;
}

.role-buttons button{
  flex:1;
}

.role-active{
  background:linear-gradient(135deg,#06b6d4,#2563eb)!important;
}

/* APP */
#appScreen{
  min-height:100vh;
  padding-bottom:50px;
}

.topbar{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(2,6,23,.9);
  border-bottom:1px solid rgba(255,255,255,.1);
  backdrop-filter:blur(12px);
}

.topbar-inner{
  width:min(1200px,94%);
  margin:auto;
  min-height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.brand{
  font-size:23px;
  font-weight:bold;
}

.brand span{
  color:#60a5fa;
}

.user-area{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}

.menu{
  width:min(1200px,94%);
  margin:20px auto;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.menu button{
  background:#172033;
  border:1px solid #334155;
}

.menu button.active{
  background:linear-gradient(135deg,#2563eb,#7c3aed);
}

.page{
  width:min(1200px,94%);
  margin:auto;
}

/* Dashboard */
.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:15px;
  margin-bottom:20px;
}

.stat{
  padding:20px;
  border-radius:16px;
  background:rgba(15,23,42,.85);
  border:1px solid rgba(255,255,255,.08);
}

.stat-number{
  font-size:28px;
  font-weight:bold;
  margin-top:7px;
}

/* PRODUCTS */
.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:18px;
}

.product{
  overflow:hidden;
}

.product-image{
  width:100%;
  height:210px;
  object-fit:cover;
  border-radius:13px;
  background:#020617;
  margin-bottom:13px;
}

.product-price{
  font-size:22px;
  font-weight:bold;
  color:#60a5fa;
  margin:8px 0;
}

.product-actions{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.product-actions button{
  flex:1;
}

/* ORDERS */
.order{
  margin-bottom:12px;
  padding:17px;
  border-radius:13px;
  background:#0f172a;
  border:1px solid #334155;
}

.status{
  display:inline-block;
  padding:5px 9px;
  border-radius:7px;
  background:#334155;
  font-size:12px;
  margin-top:7px;
}

/* CHAT */
.chat-box{
  display:flex;
  flex-direction:column;
  height:500px;
}

.chat-messages{
  flex:1;
  overflow-y:auto;
  padding:15px;
  background:#020617;
  border-radius:12px;
  margin-bottom:12px;
}

.message{
  max-width:80%;
  padding:10px 13px;
  margin-bottom:10px;
  border-radius:12px;
  line-height:1.4;
}

.message.me{
  margin-left:auto;
  background:#2563eb;
}

.message.other{
  background:#1e293b;
}

.chat-input{
  display:flex;
  gap:8px;
}

.chat-input input{
  margin:0;
}

/* TABLE */
.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:11px;
  text-align:left;
  border-bottom:1px solid #334155;
}

th{
  color:#93c5fd;
}

/* WHATSAPP */
.whatsapp-button{
  position:fixed;
  right:22px;
  bottom:22px;
  width:62px;
  height:62px;
  border-radius:50%;
  background:#25D366;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
  box-shadow:0 7px 25px rgba(37,211,102,.4);
  text-decoration:none;
  transition:.2s;
}

.whatsapp-button:hover{
  transform:scale(1.1);
}

.whatsapp-button svg{
  width:38px;
  height:38px;
}

.whatsapp-label{
  position:absolute;
  right:72px;
  white-space:nowrap;
  background:#111827;
  color:white;
  padding:8px 12px;
  border-radius:8px;
  font-size:13px;
  opacity:0;
  pointer-events:none;
  transition:.2s;
}

.whatsapp-button:hover .whatsapp-label{
  opacity:1;
}

/* AI */
.ai-box{
  max-width:750px;
}

.ai-messages{
  height:380px;
  overflow-y:auto;
  background:#020617;
  padding:15px;
  border-radius:12px;
  margin-bottom:10px;
}

.ai-input{
  display:flex;
  gap:8px;
}

.ai-input input{
  margin:0;
}

.notice{
  padding:12px;
  border-radius:10px;
  background:#172033;
  color:#cbd5e1;
  margin-bottom:15px;
}

.empty{
  padding:30px;
  text-align:center;
  color:#94a3b8;
}

/* Responsive */
@media(max-width:650px){
  .topbar-inner{
    align-items:flex-start;
    flex-direction:column;
    padding:12px 0;
  }

  .message{
    max-width:90%;
  }

  .whatsapp-button{
    right:15px;
    bottom:15px;
  }
}
</style>
</head>

<body>

<div class="stars" id="stars"></div>

<!-- AUTH SCREEN -->
<section id="authScreen">

  <div class="auth-box card">

    <div class="logo">
      Goraya <span>Store</span>
    </div>

    <div class="subtitle">
      Customer & Supplier Marketplace
    </div>

    <div class="role-buttons">
      <button id="customerRoleBtn" class="role-active" onclick="selectRole('customer')">
        Customer
      </button>

      <button id="supplierRoleBtn" onclick="selectRole('supplier')">
        Supplier
      </button>
    </div>

    <div class="tabs">
      <button id="loginTab" onclick="showAuthMode('login')">

        Register
      </button>
    </div>

    <!-- LOGIN -->
    <div id="loginForm">

      <label>Email / Gmail</label>
      <input id="loginEmail" type="email" placeholder="example@gmail.com">

      <label>Password</label>
      <input id="loginPassword" type="password" placeholder="Password">

      <button style="width:100%" onclick="loginUser()">
        Login
      </button>

      <p id="loginMessage" style="margin-top:12px"></p>

    </div>

    <!-- REGISTER -->
    <div id="registerForm" class="hidden">

      <label>Full Name</label>
      <input id="regName" placeholder="Your name">

      <label>Email / Gmail</label>
      <input id="regEmail" type="email" placeholder="example@gmail.com">

      <label>Phone</label>
      <input id="regPhone" placeholder="03xxxxxxxxx">

      <label>Password</label>
      <input id="regPassword" type="password" placeholder="Create password">

      <label>City</label>
      <input id="regCity" placeholder="Lahore">

      <label>Address</label>
      <textarea id="regAddress" placeholder="Complete address"></textarea>

      <label id="cnicLabel" class="hidden">CNIC</label>
      <input id="regCnic" class="hidden" placeholder="CNIC">

      <button style="width:100%" onclick="registerUser()">
        Create Account
      </button>

      <p id="registerMessage" style="margin-top:12px"></p>

    </div>

  </div>
</section>


<!-- APP SCREEN -->
<section id="appScreen" class="hidden">

  <div class="topbar">

    <div class="topbar-inner">

      <div class="brand">
        Goraya <span>Store</span>
      </div>

      <div class="user-area">
        <span id="welcomeUser"></span>
        <button class="btn-red" onclick="logout()">
          Logout
        </button>
      </div>

    </div>

  </div>


  <!-- CUSTOMER MENU -->
  <div id="customerMenu" class="menu hidden">

    <button onclick="customerPage('dashboard')" id="cDashboard">
      Dashboard
    </button>

    <button onclick="customerPage('products')" id="cProducts">
      Products
    </button>

    <button onclick="customerPage('orders')" id="cOrders">
      Orders
    </button>

    <button onclick="customerPage('chat')" id="cChat">
      Supplier Chat
    </button>

    <button onclick="customerPage('ai')" id="cAI">
      AI Bot
    </button>

    <button onclick="customerPage('profile')" id="cProfile">
      Profile
    </button>

    <button onclick="openWhatsApp()">
      🟢 WhatsApp
    </button>

  </div>


  <!-- SUPPLIER MENU -->
  <div id="supplierMenu" class="menu hidden">

    <button onclick="supplierPage('dashboard')" id="sDashboard">
      Dashboard
    </button>

    <button onclick="supplierPage('products')" id="sProducts">
      My Products
    </button>

    <button onclick="supplierPage('add')" id="sAdd">
      Add Product
    </button>

    <button onclick="supplierPage('orders')" id="sOrders">
      Orders
    </button>

    <button onclick="supplierPage('ledger')" id="sLedger">
      Ledger
    </button>

    <button onclick="supplierPage('chat')" id="sChat">
      Customer Chats
    </button>

    <button onclick="supplierPage('ai')" id="sAI">
      AI Bot
    </button>

    <button onclick="supplierPage('profile')" id="sProfile">
      Profile
    </button>

    <!-- ADMIN CONTACT -->
    <button onclick="openWhatsApp()">
      🟢 Contact Goraya Store
    </button>

  </div>


  <main class="page" id="page"></main>

</section>


<!-- FLOATING WHATSAPP BUTTON -->
<a
  id="whatsappButton"
  class="whatsapp-button"
  href="https://wa.me/923177389606?text=Assalam%20o%20Alaikum%20Goraya%20Store%20se%20rabta%20karna%20hai."
  target="_blank"
  rel="noopener noreferrer">

  <span class="whatsapp-label">
    WhatsApp: 03177389606
  </span>

  <!-- WhatsApp style logo -->
  <svg viewBox="0 0 32 32" fill="none">

</a>


<script>

/* =========================
   STORAGE HELPERS
========================= */

function getData(key){
  try{
    return JSON.parse(localStorage.getItem(key)) || [];
  }catch(e){
    return [];
  }
}

function saveData(key,data){
  localStorage.setItem(key,JSON.stringify(data));
}

function makeID(prefix="ID"){
  return prefix + Date.now() + Math.random().toString(36).substring(2,7);
}


/* =========================
   STORAGE KEYS
========================= */

const K = {
  customers:"gorayaCustomers",
  suppliers:"gorayaSuppliers",
  products:"gorayaProducts",
  orders:"gorayaOrders",
  chats:"gorayaChats",
  customerSession:"gorayaCustomerSession",
  supplierSession:"gorayaSupplierSession"
};


/* =========================
   CURRENT STATE
========================= */

let selectedRole = "customer";
let authMode = "login";
let currentUser = null;
let currentRole = null;
let selectedProduct = null;
let selectedSupplier = null;


/* =========================
   WHATSAPP
========================= */

function openWhatsApp(){

  const message =
    currentRole === "supplier"
      ? "Assalam o Alaikum Goraya Store Admin, mujhe supplier account ke hawale se baat karni hai."
      : "Assalam o Alaikum Goraya Store, mujhe product/order ke hawale se baat karni hai.";

  const url =
    "https://wa.me/923177389606?text=" +
    encodeURIComponent(message);

  window.open(url,"_blank");
}


/* =========================
   AUTH ROLE
========================= */

function selectRole(role){

  selectedRole = role;

  document.getElementById("customerRoleBtn")
    .classList.toggle("role-active",role==="customer");

  document.getElementById("supplierRoleBtn")
    .classList.toggle("role-active",role==="supplier");

  document.getElementById("cnicLabel")
    .classList.toggle("hidden",role!=="supplier");

  document.getElementById("regCnic")
    .classList.toggle("hidden",role!=="supplier");
}


function showAuthMode(mode){

  authMode = mode;

  document.getElementById("loginForm")
    .classList.toggle("hidden",mode!=="login");

  document.getElementById("registerForm")
    .classList.toggle("hidden",mode!=="register");
}


/* =========================
   REGISTER
========================= */

function registerUser(){

  const name = document.getElementById("regName").value.trim();
  const email = document.getElementById("regEmail").value.trim().toLowerCase();
  const phone = document.getElementById("regPhone").value.trim();
  const password = document.getElementById("regPassword").value;
  const city = document.getElementById("regCity").value.trim();
  const address = document.getElementById("regAddress").value.trim();
  const cnic = document.getElementById("regCnic").value.trim();

  const msg = document.getElementById("registerMessage");

  if(!name || !email || !phone || !password || !city || !address){
    msg.textContent = "Please fill all required fields.";
    return;
  }

  if(password.length < 4){
    msg.textContent = "Password must be at least 4 characters.";
    return;
  }


  if(selectedRole === "customer"){

    const customers = getData(K.customers);

    if(customers.some(x=>x.email===email)){
      msg.textContent = "Customer email already exists.";
      return;
    }

    customers.push({
      id:makeID("CUS"),
      name,
      email,
      phone,
      password,
      city,
      address,
      active:true,
      loginCount:0,
      lastLogin:null,
      createdAt:new Date().toISOString()
    });

    saveData(K.customers,customers);

  }else{

    const suppliers = getData(K.suppliers);

    if(suppliers.some(x=>x.email===email)){
      msg.textContent = "Supplier email already exists.";
      return;
    }

    suppliers.push({
      id:makeID("SUP"),
      name,
      email,
      phone,
      password,
      city,
      address,
      cnic,
      active:true,
      loginCount:0,
      lastLogin:null,
      createdAt:new Date().toISOString()
    });

    saveData(K.suppliers,suppliers);
  }

  msg.textContent = "Account created successfully. You can login now.";

  setTimeout(()=>{
    showAuthMode("login");
  },700);
}


/* =========================
   LOGIN
========================= */

function loginUser(){

  const email =
    document.getElementById("loginEmail").value.trim().toLowerCase();

  const password =
    document.getElementById("loginPassword").value;

  const msg =
    document.getElementById("loginMessage");

  if(!email || !password){
    msg.textContent = "Please enter email and password.";
    return;
  }


  if(selectedRole === "customer"){

    const customers = getData(K.customers);

    const user = customers.find(
      x=>x.email===email && x.password===password
    );

    if(!user){
      msg.textContent = "Invalid customer login.";
      return;
    }

    if(user.active===false){
      msg.textContent = "Your account is inactive.";
      return;
    }

    user.loginCount = Number(user.loginCount||0)+1;
    user.lastLogin = new Date().toISOString();

    saveData(K.customers,customers);

    currentUser = user;
    currentRole = "customer";

    localStorage.setItem(
      K.customerSession,
      user.id
    );

  }else{

    const suppliers = getData(K.suppliers);

    const user = suppliers.find(
      x=>x.email===email && x.password===password
    );

    if(!user){
      msg.textContent = "Invalid supplier login.";
      return;
    }

    if(user.active===false){
      msg.textContent =
        "Your supplier account is deactivated by Admin.";
      return;
    }

    user.loginCount = Number(user.loginCount||0)+1;
    user.lastLogin = new Date().toISOString();

    saveData(K.suppliers,suppliers);

    currentUser = user;
    currentRole = "supplier";

    localStorage.setItem(
      K.supplierSession,
      user.id
    );
  }

  openApp();
}


/* =========================
   SESSION
========================= */

function checkSession(){

  const customerID =
    localStorage.getItem(K.customerSession);

  const supplierID =
    localStorage.getItem(K.supplierSession);


  if(customerID){

    const user =
      getData(K.customers).find(x=>x.id===customerID);

    if(user && user.active!==false){

      currentUser=user;
      currentRole="customer";
      openApp();
      return;
    }

    localStorage.removeItem(K.customerSession);
  }


  if(supplierID){

    const user =
      getData(K.suppliers).find(x=>x.id===supplierID);

    if(user && user.active!==false){

      currentUser=user;
      currentRole="supplier";
      openApp();
      return;
    }

    localStorage.removeItem(K.supplierSession);
  }
}


/* =========================
   OPEN APP
========================= */

function openApp(){

  document.getElementById("authScreen")
    .classList.add("hidden");

  document.getElementById("appScreen")
    .classList.remove("hidden");

  document.getElementById("welcomeUser").textContent =
    currentUser.name;

  document.getElementById("customerMenu")
    .classList.toggle("hidden",currentRole!=="customer");

  document.getElementById("supplierMenu")
    .classList.toggle("hidden",currentRole!=="supplier");

  if(currentRole==="customer"){
    customerPage("dashboard");
  }else{
    supplierPage("dashboard");
  }
}


/* =========================
   LOGOUT
========================= */

function logout(){

  localStorage.removeItem(K.customerSession);
  localStorage.removeItem(K.supplierSession);

  currentUser=null;
  currentRole=null;

  document.getElementById("appScreen")
    .classList.add("hidden");

  document.getElementById("authScreen")
    .classList.remove("hidden");

  document.getElementById("loginEmail").value="";
  document.getElementById("loginPassword").value="";
}


/* =========================
   CUSTOMER PAGE
========================= */

function customerPage(page){

  if(!currentUser || currentRole!=="customer") return;

  const area = document.getElementById("page");

  if(page==="dashboard"){

    const orders =
      getData(K.orders)
      .filter(x=>x.customerId===currentUser.id);

    const products =
      getData(K.products)
      .filter(x=>
        x.approval==="Approved" &&
        x.active!==false &&
        Number(x.stock||0)>0
      );

    area.innerHTML=`

      <div class="stats">

        <div class="stat">
          <p>Welcome</p>
          <div class="stat-number">
            ${escapeHTML(currentUser.name)}
          </div>
        </div>

        <div class="stat">
          <p>Available Products</p>
          <div class="stat-number">
            ${products.length}
          </div>
        </div>

        <div class="stat">
          <p>My Orders</p>
          <div class="stat-number">
            ${orders.length}
          </div>
        </div>

      </div>

      <div class="card">
        <h2>Welcome to Goraya Store</h2>
        <p>
          Products browse karein, order place karein
          aur supplier se direct chat karein.

/* =========================
   ORDER PRODUCT
========================= */

function orderProduct(productID){

  const products=getData(K.products);

  const product=products.find(x=>x.id===productID);

  if(!product) return;

  if(product.active===false ||
     product.approval!=="Approved" ||
     Number(product.stock||0)<=0){

    alert("This product is not available.");
    return;
  }


  const quantityText =
    prompt("Quantity enter karein:", "1");

  if(quantityText===null) return;

  const quantity=Number(quantityText);

  if(!Number.isInteger(quantity) || quantity<1){
    alert("Please enter a valid quantity.");
    return;
  }

  if(quantity>Number(product.stock)){
    alert("Itni quantity stock mein available nahi.");
    return;
  }


  const amount=quantity*Number(product.price||0);

  const confirmOrder =
    confirm(
      `Product: ${product.name}\n`+
      `Quantity: ${quantity}\n`+
      `Total: Rs ${amount.toLocaleString()}\n\n`+
      `Order place karna hai?`
    );

  if(!confirmOrder) return;


  product.stock =
    Number(product.stock)-quantity;

  saveData(K.products,products);


  const orders=getData(K.orders);

  orders.push({

    id:makeID("ORD"),

    customer:{
      id:currentUser.id,
      name:currentUser.name,
      phone:currentUser.phone,
      city:currentUser.city,
      address:currentUser.address
    },

    customerId:currentUser.id,

    product:product.name,
    productId:product.id,

    quantity,

    amount,

    supplierId:product.supplierId,
    supplierName:product.supplierName,

    status:"Pending",

    createdAt:new Date().toISOString()

  });

  saveData(K.orders,orders);

  alert("Order successfully placed!");

  customerPage("orders");
}

function sendCustomerMessage(){

  const input=document.getElementById("chatText");

  const text=input.value.trim();

  if(!text) return;

  const key=
    "gorayaChat_"+
    currentUser.id+"_"+
    selectedSupplier.id+"_"+
    (selectedProduct ? selectedProduct.id : "general");

  const messages=getData(key);

  messages.push({
    sender:"customer",

  saveData(key,messages);

      `<b>${escapeHTML(m.senderName||m.sender)}</b><br>`+
      `${escapeHTML(m.text)}`;

async function saveProduct(productID){

  const name=
    document.getElementById("productName").value.trim();

  const price=
    Number(document.getElementById("productPrice").value);

  const stock=
    Number(document.getElementById("productStock").value);

  const description=
    document.getElementById("productDescription").value.trim();

  const file=
    document.getElementById("productImage").files[0];


  if(!name || price<0 || stock<0){
    alert("Product name, price aur stock enter karein.");
    return;
  }


  const products=getData(K.products);

  let product;


  if(productID){

    product=
      products.find(x=>
        x.id===productID &&
        x.supplierId===currentUser.id
      );

    if(!product) return;

    product.name=name;
    product.price=price;
    product.stock=stock;
    product.description=description;

  }else{

    product={
      id:makeID("PROD"),
      name,
      price,
      stock,
      description,
      supplierId:currentUser.id,
      supplierName:currentUser.name,
      approval:"Approved",
      active:true,
      image:"",
      createdAt:new Date().toISOString()
    };

    products.push(product);
  }


  if(file){

    product.image=
      await fileToBase64(file);
  }

  saveData(K.products,products);

  alert(
    productID
      ? "Product updated successfully."
      : "Product added successfully."
  );

  supplierPage("products");
}


function editProduct(id){

  const product=
    getData(K.products).find(x=>
      x.id===id &&
      x.supplierId===currentUser.id

function toggleProduct(id){

      <br>

      <div class="table-wrap">

        <table>

          <tr>
            <th>Customer</th>
            <th>Phone</th>
            <th>Action</th>
          </tr>

          ${
            customers.map(c=>`

              <tr>

                <td>
                  ${escapeHTML(c.name)}
                </td>

                <td>
                  ${escapeHTML(c.phone)}
                </td>

                <td>
                  <button
                    onclick="supplierChatCustomer('${c.id}')">
                    Open Chat
                  </button>
                </td>

              </tr>

            `).join("")
          }

        </table>

      </div>

    </div>
  `;
}


function supplierChatCustomer(customerID){

  const customer=
    getData(K.customers).find(x=>x.id===customerID);

  if(!customer) return;

  const key=
    "gorayaChat_"+
    customer.id+"_"+
    currentUser.id+
    "_general";

  const messages=getData(key);

  const area=document.getElementById("page");

  area.innerHTML=`

    <div class="card chat-box">

      <h2>
        Chat with ${escapeHTML(customer.name)}
      </h2>

      <div class="chat-messages" id="supplierChatMessages"></div>

      <div class="chat-input">

        <input
          id="supplierChatText"
          placeholder="Message...">

        <button
          onclick="sendSupplierMessage('${customer.id}')">
          Send
        </button>

      </div>

    </div>
  `;

  const box=
    document.getElementById("supplierChatMessages");

  messages.forEach(m=>{

    box.innerHTML+=`

      <div class="message ${
        m.sender==="supplier" ? "me":"other"
      }">

        <b>${escapeHTML(m.senderName||m.sender)}</b><br>

        ${escapeHTML(m.text)}

      </div>
    `;
  });

  box.scrollTop=box.scrollHeight;
}


function sendSupplierMessage(customerID){

  const input=
    document.getElementById("supplierChatText");

  const text=input.value.trim();

  if(!text) return;

  const key=
    "gorayaChat_"+
    customerID+"_"+
    currentUser.id+
    "_general";

  const messages=getData(key);

  messages.push({

    sender:"supplier",
    senderName:currentUser.name,
    text,
    time:new Date().toISOString()

  });

  saveData(key,messages);

  input.value="";

  supplierChatCustomer(customerID);
}

function renderSupplierProfile(){

  const area=document.getElementById("page");

  area.innerHTML=`

    <div class="card">

      <h2>Supplier Profile</h2>

      <label>Name</label>
      <input
        id="supplierProfileName"
        value="${escapeAttr(currentUser.name)}">

      <input

      <input

      <textarea
        id="supplierProfileAddress">${escapeHTML(currentUser.address)}</textarea>

      <label>CNIC</label>
      <input
        id="supplierProfileCnic"
        value="${escapeAttr(currentUser.cnic||"")}">

      <label>New Password</label>
      <input
        id="supplierProfilePassword"
        type="password"
        placeholder="Leave blank to keep old password">

      <br>

      <button onclick="updateSupplierProfile()">
        Save Profile
      </button>

      <button
        class="btn-green"
        onclick="openWhatsApp()">
        🟢 Contact Goraya Store Admin
      </button>

    </div>
  `;
}


function updateSupplierProfile(){

  const suppliers=getData(K.suppliers);

  const user=
    suppliers.find(x=>x.id===currentUser.id);

  if(!user) return;

  user.name=
    document.getElementById("supplierProfileName").value.trim();

  user.phone=
    document.getElementById("supplierProfilePhone").value.trim();

  user.city=
    document.getElementById("supplierProfileCity").value.trim();

  user.address=
    document.getElementById("supplierProfileAddress").value.trim();

  user.cnic=
    document.getElementById("supplierProfileCnic").value.trim();

  const pass=
    document.getElementById("supplierProfilePassword").value;

  if(pass){
    user.password=pass;
  }

  saveData(K.suppliers,suppliers);

  currentUser=user;

  /* Update supplier name in own products */
  const products=getData(K.products);

  products.forEach(p=>{

    if(p.supplierId===user.id){
      p.supplierName=user.name;
    }

  });

  saveData(K.products,products);

  document.getElementById("welcomeUser").textContent=
    user.name;

  alert("Supplier profile updated successfully.");
}

function fileToBase64(file){

  return new Promise((resolve,reject)=>{

    const reader=new FileReader();

    reader.onload=()=>{
      resolve(reader.result);
    };

    reader.onerror=reject;

    reader.readAsDataURL(file);

  });
}


function placeholderImage(){

  return "data:image/svg+xml;charset=UTF-8,"+
    encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg"
           width="600"
           height="400">

        <rect width="100%" height="100%"
              fill="#0f172a"/>

        <text
          x="50%"
          y="50%"
          fill="white"
          text-anchor="middle"
          dominant-baseline="middle"
          font-size="30">

          Goraya Store

        </text>

      </svg>
    `);
}


/* =========================
   SECURITY / DISPLAY
========================= */

function escapeHTML(value){

  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function escapeAttr(value){

  return escapeHTML(value);
}


function formatDate(date){

  if(!date) return "";

  try{
    return new Date(date).toLocaleString();
  }catch(e){
    return date;
  }
}


/* =========================
   ANIMATED STARS
========================= */

function createStars(){

  const box=document.getElementById("stars");

  for(let i=0;i<90;i++){

    const star=document.createElement("div");

    star.className="star";

    star.style.left=
      Math.random()*100+"%";

    star.style.top=
      Math.random()*100+"%";

    const size=
      Math.random()*3+1;

    star.style.width=size+"px";
    star.style.height=size+"px";

    star.style.animationDuration=
      (Math.random()*15+8)+"s";

    star.style.animationDelay=
      (Math.random()*10)+"s";

    box.appendChild(star);
  }
}
